<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InakiOG's Vinyl Collection — Crate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="crate.css">
</head>
<body>
  <div class="site-title-poster">
    <h1 class="site-title">Colección</h1>
    <div id="count" class="count"></div>
  </div>

  <div class="posters" aria-hidden="true">
    <img class="poster poster-1" src="assets/posters/18a17b11dd3da174b54a2cf555411933.jpg" alt="">
    <img class="poster poster-2" src="assets/posters/24d6e909a1632abe3050ae84486d7371.jpg" alt="">
    <img class="poster poster-3" src="assets/posters/39f727aa98ea526a08c3387cddd20531.jpg" alt="">
    <img class="poster poster-4" src="assets/posters/94d5ac05d26d5141b6457cbd5e55dbcc.jpg" alt="">
    <img class="poster poster-5" src="assets/posters/cb3b7a39799536380db1a797591a2da1.jpg" alt="">
    <img class="poster poster-6" src="assets/posters/f34a9dfd8b07da140b7501cdbdd137fd.jpg" alt="">
  </div>

  <div class="bookshelf" aria-hidden="true">
    <img class="magic-ball" src="assets/magic ball front.png" alt="" aria-hidden="true">
    <div class="fuggler-wrap">
      <img id="fuggler" class="fuggler" src="assets/fuggler.png" alt="Play a random song" title="Play a random song">
      <!-- to the left of the head — plain CSS position, no measurement.
           See setFugglerPlaying in crate.js: whenever any preview starts
           playing, .fuggler-wrap gets a "playing" class that moves+tilts
           it to the crate's top-left corner via a flat translate/rotate,
           and this bubble just rides along since it's nested inside it. -->
      <div id="fuggler-bubble" class="fuggler-bubble" aria-hidden="true">
        <span id="fuggler-bubble-text"></span>
        <button id="fuggler-skip" class="fuggler-skip" type="button" title="Skip to another song">⏭</button>
      </div>
    </div>
  </div>

  <a href="grid.html" class="nav-button grid-button">Grid view</a>

  <button id="sort-toggle" class="sort-toggle" type="button">Recent</button>

  <div id="cd-pile" class="cd-pile" aria-hidden="true"></div>

  <div id="cd-browser" class="cd-browser hidden" aria-hidden="true">
    <div class="cd-browser-backdrop"></div>
    <div id="cd-browser-stack" class="cd-browser-stack"></div>
  </div>

  <img id="tape-recorder" class="tape-recorder" src="assets/tape recorder.png" alt="" aria-hidden="true">

  <div id="crate-row" class="crate-row">
    <button id="crate-slot-prev" class="crate-slot-side crate" type="button" aria-label="Previous crate">
      <div class="crate-track">
        <img class="crate-box crate-back" src="assets/crate.png" alt="" aria-hidden="true">
        <div class="crate-shelf"></div>
        <img class="crate-box crate-front" src="assets/crate-front.png" alt="" aria-hidden="true">
      </div>
    </button>

    <div id="crate" class="crate">
      <div id="expand-backdrop" class="expand-backdrop" aria-hidden="true"></div>
      <div id="crate-track" class="crate-track">
        <img class="crate-box crate-back" src="assets/crate.png" alt="" aria-hidden="true">
        <div id="crate-shelf" class="crate-shelf"></div>
        <img class="crate-box crate-front" src="assets/crate-front.png" alt="" aria-hidden="true">
      </div>
    </div>

    <button id="crate-slot-next" class="crate-slot-side crate" type="button" aria-label="Next crate">
      <div class="crate-track">
        <img class="crate-box crate-back" src="assets/crate.png" alt="" aria-hidden="true">
        <div class="crate-shelf"></div>
        <img class="crate-box crate-front" src="assets/crate-front.png" alt="" aria-hidden="true">
      </div>
    </button>
  </div>

  <p id="status" class="status">Loading collection…</p>

  <script src="crate.js"></script>
</body>
</html>
